[perplexity]
perplexity/sonar            = Perplexity Sonar              | - | Sonar  | 0.22 | 2.15
anthropic/claude-haiku-5-5  = Claude Haiku 5.5 (Perplexity)  | - | Haiku  | 0.09 | 0.43
openai/gpt-6-luna           = GPT-6 Luna (Perplexity)        | - | Luna   | 0.09 | 0.43
google/gemini-3.8-flash     = Gemini 3.8 Flash (Perplexity)  | - | Flash  | 0.65 | 3.23
xai/grok-4.6                = Grok 4.6 (Perplexity)          | - | Grok   | 1.72 | 5.16
anthropic/claude-sonnet-5-5 = Claude Sonnet 5.5 (Perplexity) | - | Sonnet | 1.72 | 8.6

# [stt], [tts]: the transcription (STT) and speech (TTS) models, chosen by voice ("change de transcription",
# "change de synthèse vocale"; the choice is kept in CONFIG.INI, Stt_model and Tts_model). Same columns, the
# second being the provider (openai: key ChatGPT_key; mistral: key Mistral_key; deepgram: key Deepgram_key;
# openrouter: key OpenRouter_key, the model id being OpenRouter's, e.g. deepgram/aura-2 or openai/gpt-4o-mini-tts;
# groq: key Groq_key, Whisper, the audio sent at the end of the question, at least 10 s billed; elevenlabs: key
# ElevenLabs_key: Scribe transcription, $0.39 an hour; speech, price in = credits of a character at the Creator
# plan, about $0.09 per 1,000 characters).
# Transcription: price in = audio heard (billed by duration: counted as 10 tokens a second), price out = text
# written. Speech: price in = text read (Mistral, Deepgram: a token a character), price out = audio spoken. Their
# costs are counted apart in COSTS.TXT. Deepgram's speech model (aura-2) only names the service: its voice
# (aura-2-<name>-<language>, in [voices]) is the model of each request.
[stt]
gpt-live-transcribe                  = OpenAI Live Transcribe   | openai  | OpenAI  | 2.15  | 8.6
voxtral-mini-transcribe-realtime-3-0 = Mistral Voxtral Realtime | mistral | Voxtral | 11.47 | 0
nova-3                               = Deepgram Nova-3          | deepgram | Nova 3  | 11.04 | 0
nova-2                               = Deepgram Nova-2          | deepgram | Nova 2  | 8.36  | 0
whisper-large-v3-turbo               = Groq Whisper Turbo       | groq     | Whisper | 0.96  | 0
whisper-large-v3                     = Groq Whisper Large       | groq     | Whisper Large | 2.65 | 0
scribe_v2_realtime                   = ElevenLabs Scribe        | elevenlabs | Scribe | 9.32 | 0

[tts]
gpt-realtime-2.1-mini = OpenAI Realtime mini | openai  | OpenAI  | 0.52  | 17.2
voxtral-mini-tts-3-0  = Mistral Voxtral TTS  | mistral | Voxtral | 11.18 | 0
aura-2                = Deepgram Aura-2      | deepgram | Aura    | 25.8  | 0
eleven_flash_v2_5     = ElevenLabs Flash     | elevenlabs | ElevenLabs | 78 | 0
deepgram/aura-2       = Aura-2 (OpenRouter)  | openrouter | Aura OpenRouter | 25.8 | 0

# [voices]: the voices offered ("change de voix", Settings screen), those of the speech provider in use that speak
# the language in use. One line per voice: name = provider | voice id | languages | emotion | pace | gender
# - name: unique, said and shown to choose it (kept in CONFIG.INI, Voice)
# - provider: openai, mistral, deepgram or elevenlabs (the second column of [tts]); for a model reached through
#   OpenRouter, the model's id (deepgram/aura-2: each model has its own voices); voice id: the name the provider's
#   API knows
#   A name is unique among the voices of a provider (or of a model)
# - languages: 2-letter codes separated by commas (fr, en, nl...), * for every language
# - emotion and pace, - for none. Mistral (Voxtral 3) gets them as tags before each sentence; OpenAI in its reading
#   instructions. Emotions: amused, angry, anxious, apologetic, appreciative, assertive, bored, calm, confident,
#   confused, critical, curious, determined, disappointed, disgusted, excited, frustrated, grateful, happy,
#   hopeful, playful, proud, reflective, resigned, sad, sarcastic, skeptical, somber, surprised, tense, tired,
#   urgent, warm, wistful. Paces: very-slow, slow, moderate, fast, very-fast.
# - gender: f (a woman's voice) or m (a man's), - if neither: the assistant is told to speak of itself as a woman or
#   as a man (French, Spanish, Italian... agree with it). A line without this column takes it from the same voice of
#   the firmware's file
# The Mistral voices: GET https://api.mistral.ai/v1/audio/voices?type=preset (the voice_... ones are Voxtral 3's;
# the older xx_name_emotion ones, one per emotion, are Voxtral 2's). The Deepgram voices (Aura-2, one language
# each, no emotion nor pace): developers.deepgram.com/docs/tts-models. The ElevenLabs voices are those of your
# account (Voices, "Copy voice ID"; the default ones of ElevenLabs end on 31/12/2026); Flash v2.5 speaks 32
# languages, so a voice may be given * (without one for the language in use, the first ElevenLabs voice is used).
