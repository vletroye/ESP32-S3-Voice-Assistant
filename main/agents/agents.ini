# Models offered to answer the questions (AGENTS.INI of the configuration drive), one section per provider.
# One line per model:  model id = shown name | reasoning | spoken name | Claude thinking
#   model id      the id of the provider's API ("claude-haiku-5-5", "vendor/model" on OpenRouter)
#   shown name    in the Settings screen ("Claude Haiku 5.5")
#   reasoning     effort asked: Anthropic and OpenRouter low|medium|high, OpenAI none|low|medium|high,
#                 Google minimal|low|medium|high; low keeps the spoken answers fast
#   spoken name   short name read in the spoken list of models, and said to choose it ("Haiku")
#   Claude thinking (optional, Anthropic only): disabled | between_tools | default (left to the model);
#                 without it: disabled for a Haiku, between_tools for a Sonnet, default otherwise
# The models are numbered in this order (Settings screen, "utilise le modèle 3"). Sections: anthropic, openai,
# google, openrouter (others are ignored: a new provider needs its client in the firmware). The free OpenRouter
# models, read from its live list once a day, are added after these. Lines starting with # are comments.
# Emptied file: restored to the version given with the firmware.

[anthropic]
claude-haiku-5-5  = Claude Haiku 5.5  | low | Haiku  | disabled
claude-sonnet-5-5 = Claude Sonnet 5.5 | low | Sonnet | between_tools
claude-opus-5-5   = Claude Opus 5.5   | low | Opus   | default

[openai]
gpt-6-luna  = GPT-6 Luna  | none | Luna
gpt-6.1-sol = GPT-6.1 Sol | low  | Sol
gpt-6-astra = GPT-6 Astra | low  | Astra

[google]
gemini-3.5-flash-lite = Gemini 3.5 Flash-Lite | minimal | Flash-Lite
gemini-3.8-flash      = Gemini 3.8 Flash      | low     | Flash
gemini-4-argon        = Gemini 4 Argon        | low     | Argon

[openrouter]
deepseek/deepseek-v4.1-flash-1017 = DeepSeek V4.1 Flash | low | DeepSeek
moonshotai/kimi-k3.1-pro          = Kimi K3.1 Pro       | low | Kimi
minimax/minimax-m3.1-flash        = MiniMax M3.1 Flash  | low | MiniMax
