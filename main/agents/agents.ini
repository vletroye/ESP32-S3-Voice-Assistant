# Models offered to answer the questions (AGENTS.INI of the configuration drive), one section per provider.
# One line per model:  model id = shown name | reasoning | spoken name | price in | price out | speed | Claude thinking
#   model id      the id of the provider's API ("claude-haiku-5-5", "vendor/model" on OpenRouter)
#   shown name    in the Settings screen ("Claude Haiku 5.5")
#   reasoning     effort asked: Anthropic and OpenRouter low|medium|high, OpenAI none|low|medium|high,
#                 Google minimal|low|medium|high, xAI low|medium|high (- for a Grok model that does not take
#                 it), Mistral none|high (Medium 3.5; others may take low|medium), Perplexity
#                 minimal|low|medium|high (- not sent);
#                 low keeps the spoken answers fast
#   spoken name   short name read in the spoken list of models, and said to choose it ("Haiku")
#   price in/out  price of a million tokens read / written, in the currency of CONFIG.INI (Currency: EUR by
#                 default), for COSTS.TXT and the cost shown on screen. The prices given here are ESTIMATES in
#                 euros (from the providers' prices in dollars): check them on the providers' pages.
#   speed         (optional) fast | average | slow: written by the model test ("teste les modèles")
#   Claude thinking (optional, Anthropic only): disabled | between_tools | default (left to the model);
#                 without it: disabled for a Haiku, between_tools for a Sonnet, default otherwise
# The models are numbered in this order (Settings screen, "utilise le modèle 3"). Sections: anthropic, openai,
# google, openrouter, xai, mistral, perplexity (others are ignored: a new provider needs its client in the
# firmware). The free OpenRouter
# models, read from its live list once a day, are added after these (price 0). Lines starting with # are comments.
# Emptied file: restored to the version given with the firmware.

[anthropic]
claude-haiku-5-5  = Claude Haiku 5.5  | low | Haiku  | 0.09 | 0.43 | disabled
claude-sonnet-5-5 = Claude Sonnet 5.5 | low | Sonnet | 1.72 | 8.6  | between_tools
claude-opus-5-5   = Claude Opus 5.5   | low | Opus   | 3.44 | 17.2 | default

[openai]
gpt-6-luna  = GPT-6 Luna  | none | Luna  | 0.09 | 0.43
gpt-6.1-sol = GPT-6.1 Sol | low  | Sol   | 1.72 | 8.6
gpt-6-astra = GPT-6 Astra | low  | Astra | 8.6  | 43

[google]
gemini-3.5-flash-lite = Gemini 3.5 Flash-Lite | minimal | Flash-Lite | 0.09 | 0.34
gemini-3.8-flash      = Gemini 3.8 Flash      | low     | Flash      | 0.26 | 2.15
gemini-4-argon        = Gemini 4 Argon        | low     | Argon      | 1.72 | 10.32

[openrouter]
deepseek/deepseek-v4.1-flash-1017 = DeepSeek V4.1 Flash | low | DeepSeek | 0.02 | 0.86
moonshotai/kimi-k3.1-pro          = Kimi K3.1 Pro       | low | Kimi     | 1.72 | 8.6
minimax/minimax-m3.1-flash        = MiniMax M3.1 Flash  | low | MiniMax  | 0.09 | 0.47

[xai]
grok-4.7 = Grok 4.7 | low | Grok | 1.72 | 5.16
# Without reasoning ("-": no reasoning_effort sent): xAI's fast model, like Haiku
grok-4.20-0309-non-reasoning = Grok 4.20 rapide | - | Grok rapide | 1.08 | 2.15

# Mistral AI (Mistral_key): Small, fast and cheap; Medium; Large, the largest (the ids
# and rate limits of an account are on its console, "Limits")
[mistral]
mistral-small-2603    = Mistral Small 4            | none | Mistral Small | 0.13 | 0.52
mistral-medium-latest = Mistral Medium 3.5        | none | Medium        | 1.29 | 6.45
mistral-large-4       = Mistral Large 4            | -    | Large         | 1.17 | 3.59

# Perplexity (Perplexity_key): Sonar, or a model of another provider served by Perplexity ("vendor/model"), answers
