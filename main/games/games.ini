# Games between two BOX on the same network (GAMES.INI of the configuration drive).
# Say the wake word to both, then a phrase of a game: the two BOX take turns, each with its own model and voice,
# until the wake word is said again (or Game_turns_max lines, CONFIG.INI).
#
# One section per game:
#   name_<lang>    its name, said and shown (name_en when the language has none)
#   phrases_<lang> what starts it, separated by |  (a phrase found in what was said, case and accents ignored)
#   first          the instruction of the very first line (the BOX that starts)
#   rules          the instruction of every line: the other BOX's last line is what it answers
# The instructions are for the model, in English: it speaks the language of the BOX anyway.
# Emptied, this file comes back as the firmware gives it.

[debate]
name_fr = Débat
name_en = Debate
name_nl = Debat
name_de = Debatte
name_es = Debate
name_it = Dibattito
phrases_fr = disputez-vous | disputez vous | débattez | faites un débat | engueulez-vous
phrases_en = argue | have a debate | debate each other
phrases_nl = maak ruzie | debatteer | voer een debat
phrases_de = streitet euch | debattiert | macht eine debatte
phrases_es = discutid | pelead | haced un debate
phrases_it = litigate | discutete | fate un dibattito
first = Open a friendly but heated debate: state a bold, debatable opinion on an everyday topic of your choice (food, holidays, pets, technology...), in one or two sentences.
rules = You are in a lively debate with the other assistant. Contradict its last line with one strong, funny argument, then make a counter-claim. Never agree completely. Stay polite and good-natured.

[riddles]
name_fr = Concours de devinettes
name_en = Riddle contest
name_nl = Raadselwedstrijd
name_de = Rätselwettbewerb
name_es = Concurso de adivinanzas
name_it = Gara di indovinelli
phrases_fr = concours de devinettes | devinettes | faites des devinettes
phrases_en = riddle contest | riddles | tell riddles
phrases_nl = raadsels | raadselwedstrijd
phrases_de = rätsel | rätselwettbewerb
phrases_es = adivinanzas | concurso de adivinanzas
phrases_it = indovinelli | gara di indovinelli
first = Open a riddle contest: ask one short riddle whose answer you know (a single word or a short phrase). Ask only the riddle.
rules = You play a riddle contest with the other assistant, turn by turn. If its last line asks a riddle: answer it in one short sentence. If its last line answers YOUR riddle: if the answer is right, say only that it is correct and congratulate it (it then asks the next riddle); if it is wrong, say so, give the right answer, then ask a new riddle. If its last line says your answer was correct: ask a new riddle. Never repeat a riddle already asked.
