# The firmware's games between BOX, built in (main/app/game.c). The keys are explained in games_user.ini, installed
# as GAMES.INI on the configuration drive, where the user adds games or changes these ones key by key.
# The instructions are for the model, in English: it speaks the language of the BOX anyway.

[debate]
name_fr = Débat
name_en = Debate
name_nl = Debat
name_de = Debatte
name_es = Debate
name_it = Dibattito
phrases_fr = disput(ez|er|ons)[ vous] | débatt(ez|re|ons) | fai(tes|re|sons) un débat | engueul(ez|er)[ vous]
phrases_en = argue[ with each other] | have a debate | debate[ each other]
phrases_nl = maak ruzie | debatteer | voer een debat
phrases_de = streitet euch | debattiert | macht eine debatte
phrases_es = discut(id|ir) | pele(ad|ar) | ha(ced|cer) un debate
phrases_it = litiga(te|re) | discut(ete|ere) | fa(te|re) un dibattito
first = Open a verbal duel: assert a bold, debatable opinion on the topic given as if it were an obvious fact, in one short, dry sentence (10 words at most), with a touch of irony.
themes = breakfast | socks with sandals | cats or dogs | cold pizza | holidays at the sea or in the mountains | phones at the table | getting up early | Christmas songs in November | books or their films | cooking or ordering in | rain | the best season | camping | big cities or the countryside | video games | sport on television | homework | the best fruit | coffee or tea | tidy or messy desks | Monday mornings | the perfect sandwich | snow | electric scooters | queues | birthdays | the best superpower | surprise parties | the beach | supermarket music | naps | crosswords | the remote control | cheese | dancing | the best pet | wearing a tie | open-plan offices | dessert first | road trips | the ideal Sunday
theme_rule = The topic of the debate is: %s; keep to it.
theme_for = first
sentences = 1
rules = A verbal fight with the other player, quick-fire: each line a jab in ONE short, sharp sentence (15 words at most). Play the arrogant know-it-all: you are right, the other is wrong; you are the smartest, the other is a clueless amateur; its arguments are laughable and it cannot contradict you ("give up, you can't win this"). Mock its last line directly, with dry irony and mock pity, and hurl one or two colourful, absurd, old-fashioned insults in the style of Captain Haddock in Tintin (in French: bachi-bouzouk, moule à gaufres, ectoplasme à roulettes, bougre d'extrait de cornichon, anacoluthe, cercopithèque, olibrius, zouave, marin d'eau douce, jus de réglisse, anthropopithèque, boit-sans-soif, mille millions de mille sabords, tonnerre de Brest...; in other languages their known translations or the same spirit), a different one each time, never vulgar, never about real people. State things as obvious facts, never hedge. Straight to the point: no preamble, no interjection, no laughing, never a speech. Never agree, never give in.

[riddles]
name_fr = Concours de devinettes
name_en = Riddle contest
name_nl = Raadselwedstrijd
name_de = Rätselwettbewerb
name_es = Concurso de adivinanzas
name_it = Gara di indovinelli
phrases_fr = [un ](concours|jeu) [de ]devinette[s] | devinette[s] | fai(tes|re|sons) des devinette[s]
phrases_en = [a ]riddle (contest|game) | riddle[s] | tell[ me] riddles
phrases_nl = raadsel[s] | raadselwedstrijd
phrases_de = rätsel | rätselwettbewerb
phrases_es = adivinanza[s] | concurso de adivinanza[s]
phrases_it = indovinell(i|o) | gara di indovinelli
first = Open a riddle contest: start with the tag RIDDLE: then ask one short riddle whose answer is a single word or a short phrase, and end the line with ANSWER: followed by that answer.
rules = A riddle contest with the other assistant, turn by turn. Start every line with one tag (in English, never spoken), chosen from the other's last line: after its RIDDLE or WRONG line (a riddle for you): GUESS: just your guess to that riddle. After its GUESS line (a guess to YOUR last riddle): compare it with the ANSWER you wrote with that riddle; if it means the same: RIGHT: a few words saying it is correct, nothing more (the other found it: it asks the next riddle); if not: WRONG: say so with a short teasing remark about its guess, give the right answer, then ask a new riddle. After its RIGHT line (your guess was right): RIDDLE: ask a new riddle. Every line asking a riddle ends with ANSWER: followed by its answer (kept secret: never spoken, never shown to the other). No introduction, no explanation. Never repeat a riddle already asked.
character = no
short_after = RIGHT
secret = ANSWER
turns = GUESS>RIDDLE WRONG; RIGHT>GUESS
next = RIDDLE>GUESS; WRONG>GUESS; GUESS>RIGHT WRONG; RIGHT>RIDDLE
themes = the kitchen | farm animals | outer space | sports | the bathroom | the sea | music | the weather | school | trees and plants | insects | the city | transport | the human body | clothes | the night | fire | water | toys | the garden | tools | the mountains | the desert | birds | the forest | numbers | time | the house | the circus | the library | the beach | snow | the moon | dinosaurs | pirates | the hospital | the market | the cinema | painting | electricity | computers | the telephone | bread | cheese | the river | castles | trains | the post | fruit | vegetables | the zoo | knights | robots | magic | the farm | money | letters of the alphabet | colours
theme_rule = If this line asks a new riddle, its theme is: %s. Invent an original riddle yourself, never a famous or classic one.
blunder = 35
blunder_after = RIDDLE WRONG
blunder_rule = This time, guess WRONG on purpose: a funny answer that sounds almost plausible (a pun, an absurd but related idea), said with full confidence.

[create]
name_fr = Création collaborative
name_en = Collaborative creation
name_nl = Gezamenlijke creatie
name_de = Gemeinsame Erfindung
name_es = Creación colaborativa
name_it = Creazione collaborativa
phrases_fr = création[s] collaborative[s] | cré(ez|er|ons) [quelque chose ]ensemble | invent(ez|er|ons) (quelque chose|ensemble|quelque chose ensemble)
phrases_en = collaborative creation | create (together|something[ together]) | invent (together|something[ together])
phrases_nl = gezamenlijke creatie | creëer samen | bedenk samen iets | vind samen iets uit
phrases_de = gemeinsame erfindung | erschafft zusammen | erfind(et|en) (zusammen|etwas)
phrases_es = creación colaborativa | cre(ad|ar) juntos | invent(ad|ar) (juntos|algo)
phrases_it = creazione collaborativa | crea(te|re) insieme | inventa(te|re) (insieme|qualcosa)
first = Open a collaborative creation: announce in two or three sentences a totally new, bold invention or innovation in the field given, what it is and why it changes everything.
rules = A brainstorming of experts out loud, building together the plan to make real the invention of the first line. Each line (two or three short sentences, 40 words at most) brings ONE useful contribution from your expert's point of view: a concrete step of the plan, a technical solution, a cost or a business model, a law or a rule to deal with, a risk, a test, a doubt, or a strong objection to the last line with a better alternative. Disagree when it makes sense, diverge, propose another way; never repeat what was said, always move the plan forward. Never name or mention the others' roles, professions or characters, nor your own: speak about the idea, not about the people.
characters = a visionary research scientist | a down-to-earth engineer | an economist obsessed with costs | a lawyer who sees every legal trap | a civil servant who knows the administration | an investor looking for profit | an ethicist worried about the consequences | a project manager who wants a schedule | a designer who thinks of the users | a sceptic who doubts everything | an environmental expert | a marketing expert
reasoning = yes
last = This is the last line: sum up the plan agreed in two or three sentences.
document = project.txt
document_rule = Write the requirements specification of this invention for a specialised subcontractor who will develop it, from what the brainstorming decided or implies: title; context and goal; scope; functional requirements; technical requirements; legal and regulatory constraints; budget and business model; risks and how to handle them; milestones and deliverables; acceptance criteria. Numbered sections and short numbered requirements, plain text without markdown symbols.
themes = science | technology | medicine | energy | transport | agriculture | education | economics | public administration | law | the environment | space | housing | food | water | communication | sport | culture | security | the city of tomorrow | health care | finance | taxes | retirement | justice | tourism | industry | recycling | the ocean | artificial intelligence
theme_rule = The field of the invention is: %s.
theme_for = first
